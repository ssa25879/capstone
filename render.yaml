# Render 배포 설정 (Blueprint)
# 비밀 값(sync: false)은 Render 대시보드에서 직접 입력합니다. 이 파일에는 값을 넣지 않습니다.
services:
  - type: web
    name: frending
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/check-login
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
